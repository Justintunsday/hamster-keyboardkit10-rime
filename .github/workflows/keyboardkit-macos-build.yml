name: KeyboardKit macOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Download Rime frameworks
        run: make framework

      - name: Build input schemas
        run: make schema

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Hamster.xcodeproj -scheme Hamster

      - name: Build Hamster scheme
        run: >-
          xcodebuild build
          -project Hamster.xcodeproj
          -scheme Hamster
          -sdk iphoneos
          -configuration Release
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=''

      - name: Archive Hamster for IPA packaging
        run: >-
          xcodebuild archive
          -project Hamster.xcodeproj
          -scheme Hamster
          -sdk iphoneos
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Hamster.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=''

      - name: Package unsigned and ad hoc entitled IPAs
        shell: bash
        run: |
          set -euo pipefail

          archive_path="$RUNNER_TEMP/Hamster.xcarchive"
          app_path="$archive_path/Products/Applications/Hamster.app"
          payload_path="$RUNNER_TEMP/Payload"
          unsigned_ipa_path="$RUNNER_TEMP/Hamster-unsigned.ipa"
          adhoc_ipa_path="$RUNNER_TEMP/Hamster-adhoc-entitled-trollstore.ipa"

          test -d "$archive_path"
          test -d "$app_path"
          test -d "$app_path/PlugIns"
          test -d "$app_path/PlugIns/HamsterKeyboard.appex"
          test -x "$app_path/PlugIns/HamsterKeyboard.appex/HamsterKeyboard"
          test -d "$app_path/PlugIns/SbxlmKeyboard.appex"
          test -x "$app_path/PlugIns/SbxlmKeyboard.appex/SbxlmKeyboard"

          rm -rf "$payload_path"
          mkdir -p "$payload_path"
          ditto "$app_path" "$payload_path/Hamster.app"

          test -x "$payload_path/Hamster.app/Hamster"
          test -d "$payload_path/Hamster.app/PlugIns/HamsterKeyboard.appex"
          test -x "$payload_path/Hamster.app/PlugIns/HamsterKeyboard.appex/HamsterKeyboard"
          test -d "$payload_path/Hamster.app/PlugIns/SbxlmKeyboard.appex"
          test -x "$payload_path/Hamster.app/PlugIns/SbxlmKeyboard.appex/SbxlmKeyboard"

          # Preserve a completely unsigned IPA for ordinary re-signing workflows.
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$payload_path" "$unsigned_ipa_path"
          test -s "$unsigned_ipa_path"

          unsigned_ipa_listing=$(unzip -Z1 "$unsigned_ipa_path")
          grep -Fqx "Payload/Hamster.app/Hamster" <<<"$unsigned_ipa_listing"
          grep -Eq "^Payload/Hamster.app/PlugIns/HamsterKeyboard\\.appex/" <<<"$unsigned_ipa_listing"
          grep -Fqx "Payload/Hamster.app/PlugIns/HamsterKeyboard.appex/HamsterKeyboard" <<<"$unsigned_ipa_listing"
          grep -Eq "^Payload/Hamster.app/PlugIns/SbxlmKeyboard\\.appex/" <<<"$unsigned_ipa_listing"
          grep -Fqx "Payload/Hamster.app/PlugIns/SbxlmKeyboard.appex/SbxlmKeyboard" <<<"$unsigned_ipa_listing"

          unsigned_ipa_size=$(stat -f %z "$unsigned_ipa_path")
          echo "Unsigned IPA: $unsigned_ipa_path (${unsigned_ipa_size} bytes)"
          echo "This IPA is unsigned and must be re-signed before installation."

          # Sign nested frameworks before their containing extensions and app.
          # The ad hoc signature intentionally carries the checked-in entitlements,
          # which is useful for TrollStore-like sideloading. It is not a substitute
          # for a provisioning profile from Apple or an enterprise signer.
          sign_nested_frameworks() {
            local bundle_path="$1"
            local framework_path
            if [ -d "$bundle_path/Frameworks" ]; then
              while IFS= read -r -d '' framework_path; do
                /usr/bin/codesign --force --sign - --timestamp=none "$framework_path"
              done < <(find "$bundle_path/Frameworks" -depth -type d -name '*.framework' -print0)
            fi
          }

          app_to_sign="$payload_path/Hamster.app"
          keyboard_appex="$app_to_sign/PlugIns/HamsterKeyboard.appex"
          sbxlm_appex="$app_to_sign/PlugIns/SbxlmKeyboard.appex"

          sign_nested_frameworks "$keyboard_appex"
          sign_nested_frameworks "$sbxlm_appex"
          sign_nested_frameworks "$app_to_sign"

          /usr/bin/codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements "$GITHUB_WORKSPACE/HamsterKeyboard/HamsterKeyboard.entitlements" \
            "$keyboard_appex"
          /usr/bin/codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements "$GITHUB_WORKSPACE/SbxlmKeyboard/SbxlmKeyboard.entitlements" \
            "$sbxlm_appex"
          /usr/bin/codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements "$GITHUB_WORKSPACE/Hamster/Hamster.entitlements" \
            "$app_to_sign"

          /usr/bin/codesign --verify --strict "$keyboard_appex"
          /usr/bin/codesign --verify --strict "$sbxlm_appex"
          /usr/bin/codesign --verify --deep --strict "$app_to_sign"

          app_group="group.dev.fuxiao.app.Hamster"
          verify_application_group() {
            local bundle_path="$1"
            local bundle_label="$2"
            local entitlements_dump="$RUNNER_TEMP/${bundle_label}.entitlements.plist"
            local actual_group

            # --xml makes the output a parseable plist while keeping this check
            # independent of the source files used by the signing command.
            /usr/bin/codesign -d --xml --entitlements - "$bundle_path" > "$entitlements_dump" 2>/dev/null
            test -s "$entitlements_dump"
            actual_group=$(/usr/libexec/PlistBuddy -c \
              'Print :com.apple.security.application-groups:0' "$entitlements_dump")
            if [ "$actual_group" != "$app_group" ]; then
              echo "Unexpected App Group in $bundle_path: $actual_group" >&2
              exit 1
            fi
            if /usr/libexec/PlistBuddy -c \
              'Print :com.apple.security.application-groups:1' "$entitlements_dump" >/dev/null 2>&1; then
              echo "More than one App Group was signed into $bundle_path" >&2
              exit 1
            fi
          }

          verify_application_group "$keyboard_appex" HamsterKeyboard
          verify_application_group "$sbxlm_appex" SbxlmKeyboard
          verify_application_group "$app_to_sign" Hamster

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$payload_path" "$adhoc_ipa_path"
          test -s "$adhoc_ipa_path"
          adhoc_ipa_listing=$(unzip -Z1 "$adhoc_ipa_path")
          grep -Fqx "Payload/Hamster.app/Hamster" <<<"$adhoc_ipa_listing"
          grep -Fqx "Payload/Hamster.app/PlugIns/HamsterKeyboard.appex/HamsterKeyboard" <<<"$adhoc_ipa_listing"
          grep -Fqx "Payload/Hamster.app/PlugIns/SbxlmKeyboard.appex/SbxlmKeyboard" <<<"$adhoc_ipa_listing"
          adhoc_ipa_size=$(stat -f %z "$adhoc_ipa_path")
          echo "Ad hoc entitled IPA: $adhoc_ipa_path (${adhoc_ipa_size} bytes)"
          echo "Use this artifact for TrollStore-like sideloading where the signature is preserved."
          echo "AltStore and enterprise re-signing remain subject to their provisioning profiles."

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hamster-iOS-unsigned-ipa
          path: ${{ runner.temp }}/Hamster-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload ad hoc entitled IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hamster-iOS-adhoc-entitled-trollstore-ipa
          path: ${{ runner.temp }}/Hamster-adhoc-entitled-trollstore.ipa
          if-no-files-found: error
          retention-days: 14

  rime-simulator-deployment:
    name: RIME deployment on iOS Simulator
    # The downloaded librime XCFramework contains x86_64 simulator slices
    # (some libraries do not contain arm64-simulator). Keep this job on an
    # Intel virtual Mac while the device IPA job above remains unchanged.
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Download Rime frameworks
        run: make framework

      - name: Build input schemas
        run: make schema

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Hamster.xcodeproj -scheme Hamster

      - name: Prepare Simulator diagnostics
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/rime-simulator-deployment"

      - name: Build Hamster for iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project Hamster.xcodeproj \
            -scheme Hamster \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/HamsterSimulatorDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/rime-simulator-deployment/HamsterSimulator.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS=arm64 \
            2>&1 | tee "$RUNNER_TEMP/rime-simulator-deployment/xcodebuild-build.log"

      - name: Sign Simulator app with App Group entitlement
        shell: bash
        run: |
          set -euo pipefail

          app_path="$RUNNER_TEMP/HamsterSimulatorDerivedData/Build/Products/Release-iphonesimulator/Hamster.app"
          test -d "$app_path"

          sign_nested_code() {
            local bundle_path="$1"
            local code_path
            if [[ -d "$bundle_path/Frameworks" ]]; then
              while IFS= read -r -d '' code_path; do
                /usr/bin/codesign --force --sign - --timestamp=none "$code_path"
              done < <(find "$bundle_path/Frameworks" -depth \( -type d -name '*.framework' -o -type f -name '*.dylib' \) -print0)
            fi
          }

          sign_bundle() {
            local bundle_path="$1"
            local entitlements_path="$2"
            sign_nested_code "$bundle_path"
            /usr/bin/codesign --force --sign - --timestamp=none --generate-entitlement-der \
              --entitlements "$entitlements_path" "$bundle_path"
            /usr/bin/codesign --verify --strict "$bundle_path"
          }

          keyboard_entitlements="$GITHUB_WORKSPACE/HamsterKeyboard/HamsterKeyboard.entitlements"
          keyboard_appex="$app_path/PlugIns/HamsterKeyboard.appex"
          sbxlm_appex="$app_path/PlugIns/SbxlmKeyboard.appex"
          test -d "$keyboard_appex"
          test -d "$sbxlm_appex"

          sign_bundle "$keyboard_appex" "$keyboard_entitlements"
          sign_bundle "$sbxlm_appex" "$keyboard_entitlements"
          sign_bundle "$app_path" "$keyboard_entitlements"

          echo "SIMULATOR_APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Install and exercise first-launch RIME deployment
        shell: bash
        env:
          RIME_SIMULATOR_ARTIFACT_DIR: ${{ runner.temp }}/rime-simulator-deployment
          RIME_SIMULATOR_TIMEOUT_SECONDS: '180'
        run: bash ci_scripts/verify_rime_simulator_deployment.sh

      - name: Upload RIME Simulator logs and container output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hamster-iOS-Simulator-RIME-deployment
          path: ${{ runner.temp }}/rime-simulator-deployment
          if-no-files-found: warn
          retention-days: 14
