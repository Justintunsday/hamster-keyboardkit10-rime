name: KeyboardKit macOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Download Rime frameworks
        run: make framework

      - name: Build input schemas
        run: make schema

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Hamster.xcodeproj -scheme Hamster

      - name: Build Hamster scheme
        run: >-
          xcodebuild build
          -project Hamster.xcodeproj
          -scheme Hamster
          -sdk iphoneos
          -configuration Release
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=''

      - name: Archive Hamster app
        run: >-
          xcodebuild archive
          -project Hamster.xcodeproj
          -scheme Hamster
          -sdk iphoneos
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath Hamster.xcarchive
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=''

      - name: Package unsigned ipa
        run: |
          APP_PATH=$(find Hamster.xcarchive -name '*.app' -type d | head -1)
          echo "Packaging ${APP_PATH}"
          codesign --force --deep --sign - --timestamp=none "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Hamster-unsigned.ipa Payload

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hamster-unsigned-ipa
          path: Hamster-unsigned.ipa
          if-no-files-found: error
