name: ios-build

on:
  push:
  pull_request:

env:
  RIME_ICE_VERSION: 2026.06.30
  RIME_ICE_URL: https://github.com/iDvel/rime-ice/releases/download/2026.06.30/full.zip
  RIME_ICE_SHA256: 675d23b070be00e1b800f9a6db033ef98f4493cd5b568ed8aa3b3541769c46ac
  LIBRIME_VERSION: 1.16.1-pack.8

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Verify RIME key routing
        run: |
          set -euo pipefail
          bridge="PinyinCore/Sources/RimeKitBridge/RimeKitBridge.m"
          grep -Fq 'RimeKitKeyProcessingResultHandled' "$bridge"
          grep -Fq 'RimeKitKeyProcessingResultUnhandled' "$bridge"
          grep -Fq 'RimeKitKeyProcessingResultNativeError' "$bridge"
          grep -Fq 'api->start_maintenance(true)' "$bridge"
          grep -Fq 'api->join_maintenance_thread()' "$bridge"
          grep -Fq 'RIME deployment output missing' "$bridge"
          grep -Fq 'RIME schema selection failed' "$bridge"
          grep -Fq 'RIME get_context failed' "$bridge"
          grep -Fq 'candidate_list_begin' "$bridge"
          grep -Fq '[self processKeyCode:0xFF08]' "$bridge"
          grep -Fq '[self processKeyCode:0xFF0D]' "$bridge"
          grep -Fq '[self processKeyCode:0x20]' "$bridge"
          if grep -Fq '[self processKeyCode:0x08]' "$bridge"; then
            echo 'ASCII backspace keycode remains in RIME bridge' >&2
            exit 1
          fi
          if grep -Fq '[self processKeyCode:0x0d]' "$bridge"; then
            echo 'ASCII return keycode remains in RIME bridge' >&2
            exit 1
          fi

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            .build
            PinyinCore/.build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('PinyinCore/Package.swift', 'project.yml') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Prepare pinned rime-ice resources
        env:
          RIME_ARCHIVE: ${{ runner.temp }}/rime-ice-${{ env.RIME_ICE_VERSION }}.zip
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$RIME_ICE_URL" --output "$RIME_ARCHIVE"
          echo "$RIME_ICE_SHA256  $RIME_ARCHIVE" | shasum --algorithm 256 --check --strict
          rm -rf PinyinCore/Sources/PinyinCore/Resources/Rime
          mkdir -p PinyinCore/Sources/PinyinCore/Resources/Rime
          ditto -x -k "$RIME_ARCHIVE" PinyinCore/Sources/PinyinCore/Resources/Rime
          cp scripts/rime_ice.mobile.schema.yaml PinyinCore/Sources/PinyinCore/Resources/Rime/rime_ice.schema.yaml
          mkdir -p PinyinCore/Sources/PinyinCore/Resources/Rime/opencc
          cp scripts/rime_ice.mobile.s2t.json PinyinCore/Sources/PinyinCore/Resources/Rime/opencc/s2t.json
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/ddddxxx/SwiftyOpenCC/1d8105a0f7199c90af722bff62728050c858e777/Sources/OpenCC/Dictionary/STCharacters.ocd2" --output PinyinCore/Sources/PinyinCore/Resources/Rime/opencc/STCharacters.ocd2
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/ddddxxx/SwiftyOpenCC/1d8105a0f7199c90af722bff62728050c858e777/Sources/OpenCC/Dictionary/STPhrases.ocd2" --output PinyinCore/Sources/PinyinCore/Resources/Rime/opencc/STPhrases.ocd2
          echo 'AABED624D0576B8D6A8FF6C143FB37B432DD5A4FF421260172E691679FC43FE9  PinyinCore/Sources/PinyinCore/Resources/Rime/opencc/STCharacters.ocd2' | shasum --algorithm 256 --check --strict
          echo '2E68E25F2385936970E2ABA9AC71A873BC9A3AB426E3A69251E3048C6A508141  PinyinCore/Sources/PinyinCore/Resources/Rime/opencc/STPhrases.ocd2' | shasum --algorithm 256 --check --strict
          test -f PinyinCore/Sources/PinyinCore/Resources/Rime/default.yaml
          test -f PinyinCore/Sources/PinyinCore/Resources/Rime/rime_ice.schema.yaml
          test -f PinyinCore/Sources/PinyinCore/Resources/Rime/rime_ice.dict.yaml
          test -f PinyinCore/Sources/PinyinCore/Resources/Rime/cn_dicts/8105.dict.yaml
          test -f PinyinCore/Sources/PinyinCore/Resources/Rime/cn_dicts/base.dict.yaml
          test -f PinyinCore/Sources/PinyinCore/Resources/Rime/cn_dicts/ext.dict.yaml
          test -f PinyinCore/Sources/PinyinCore/Resources/Rime/cn_dicts/tencent.dict.yaml
          test -f PinyinCore/Sources/PinyinCore/Resources/Rime/cn_dicts/others.dict.yaml
          test -f PinyinCore/Sources/PinyinCore/Resources/Rime/melt_eng.schema.yaml
          test -f PinyinCore/Sources/PinyinCore/Resources/Rime/radical_pinyin.schema.yaml
          test -f PinyinCore/Sources/PinyinCore/Resources/Rime/opencc/s2t.json
          test -f PinyinCore/Sources/PinyinCore/Resources/Rime/opencc/STCharacters.ocd2
          test -f PinyinCore/Sources/PinyinCore/Resources/Rime/opencc/STPhrases.ocd2
          grep -Fq 'dictionary: rime_ice' PinyinCore/Sources/PinyinCore/Resources/Rime/rime_ice.schema.yaml
          grep -Fq 'enable_user_dict: true' PinyinCore/Sources/PinyinCore/Resources/Rime/rime_ice.schema.yaml
          grep -Fq 'simplifier@traditionalize' PinyinCore/Sources/PinyinCore/Resources/Rime/rime_ice.schema.yaml
          grep -Fq 'opencc_config: s2t.json' PinyinCore/Sources/PinyinCore/Resources/Rime/rime_ice.schema.yaml
          ! grep -Eq '^[[:space:]]*-[[:space:]]+lua_' PinyinCore/Sources/PinyinCore/Resources/Rime/rime_ice.schema.yaml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project PinyinKeyboard.xcodeproj

      - name: Build unsigned iOS device product
        run: |
          xcodebuild \
            -project PinyinKeyboard.xcodeproj \
            -scheme PinyinKeyboard \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/PinyinKeyboard.app"
          test -d "$APP_PATH"

          KEYBOARDKIT_FRAMEWORK="$(find build/DerivedData -type d -name KeyboardKit.framework -print -quit)"
          test -n "$KEYBOARDKIT_FRAMEWORK"
          mkdir -p "$APP_PATH/Frameworks"
          if [ ! -d "$APP_PATH/Frameworks/KeyboardKit.framework" ]; then
            ditto "$KEYBOARDKIT_FRAMEWORK" "$APP_PATH/Frameworks/KeyboardKit.framework"
          fi

          test -n "$(find "$APP_PATH" -name default.yaml -print -quit)"
          test -n "$(find "$APP_PATH" -name rime_ice.schema.yaml -print -quit)"
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/
          (cd artifacts && ditto -c -k --sequesterRsrc --keepParent Payload PinyinKeyboard-unsigned.ipa)
          shasum --algorithm 256 artifacts/PinyinKeyboard-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PinyinKeyboard-unsigned-iphoneos
          path: artifacts/PinyinKeyboard-unsigned.ipa
