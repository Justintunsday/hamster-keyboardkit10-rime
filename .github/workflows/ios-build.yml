name: ios-build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            .build
            PinyinCore/.build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift', 'PinyinCore/Package.swift', 'project.yml') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS device archive
        run: xcodebuild -project PinyinKeyboard.xcodeproj -scheme PinyinKeyboard -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package unsigned IPA
        run: |
          mkdir -p artifacts/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/PinyinKeyboard.app artifacts/Payload/
          cd artifacts
          zip -r PinyinKeyboard-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PinyinKeyboard-unsigned.ipa
          path: artifacts/PinyinKeyboard-unsigned.ipa
